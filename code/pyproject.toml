[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flare-embedding-eval"
version = "0.1.0"
description = "Task-agnostic embedding model evaluation with normalizing flows"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["flare*"]
