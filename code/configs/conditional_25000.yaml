model: CondNSF
layers: 6
hidden_mult: 1
cond_hidden: 256
cond_inject: FiLM
dropout: 0.0
spline_bins: 4
use_actnorm: true
use_inv1x1: true
optimizer: AdamW
lr: 0.1
lr_scheduler: ReduceLROnPlateau
lr_patience: 10
lr_factor: 0.9
lr_min_lr: 1e-5
weight_decay: 1e-3
batch_size: 64
grad_accum_steps: 4
ema_decay: 0.999
early_stop_patience: 10
x_standardize: true
y_pca_keep_var: 1.0
seed: 43
max_epochs: 500
use_amp: true
context_proj_dim: null
