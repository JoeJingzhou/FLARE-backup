model: NSF
layers: 6
hidden_mult: 1
spline_bins: 4
use_actnorm: true
use_inv1x1: true
optimizer: AdamW
lr: 0.02
lr_scheduler: ReduceLROnPlateau
lr_patience: 4
lr_factor: 0.8
lr_min_lr: 1e-4
weight_decay: 1e-3
batch_size: 256
grad_accum_steps: 2
ema_decay: 0.999
early_stop_patience: 30
nll_improvement_patience: 5
nll_improvement_threshold: 0.5
window_improvement_threshold: 3.0
pca_keep_var: 1
seed: 45
max_epochs: 1000
use_amp: true
